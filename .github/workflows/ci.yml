name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fusion, content-pack and UI string tests
        run: ./gradlew test
      - name: Build release APK
        run: ./gradlew :mobile:assembleRelease
      - name: APK size budget (40 MB)
        working-directory: .
        run: scripts/check_apk_size.sh app/mobile/build/outputs/apk/release/mobile-release.apk
